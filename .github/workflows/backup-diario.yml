name: Backup diário

on:
  schedule:
    # 06:00 em Brasília (UTC-3) = 09:00 UTC.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala o cliente do Postgres 17 (pg_dump)
        # O repositório padrão do Ubuntu só tem o postgresql-client 16, mas o
        # Supabase roda Postgres 17 — pg_dump recusa fazer dump de um
        # servidor mais novo que ele mesmo. Usa o repositório oficial do
        # PostgreSQL pra instalar a versão certa.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Instala as dependências do script de backup
        run: npm install --no-save @supabase/supabase-js googleapis jszip

      - name: Roda o backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          BACKUP_RETENCAO_DIAS: '30'
          DISPARADO_MANUALMENTE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/backup-diario.mjs
